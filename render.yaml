services:
  - type: web
    name: deeptrace2-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: ALLOWED_ORIGINS
        value: ""
      - key: FRONTEND_URL
        value: ""
